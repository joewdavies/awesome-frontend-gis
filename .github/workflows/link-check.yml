name: Check links
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  link_checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          args: --verbose --no-progress --max-concurrency 4 --max-retries 3 --retry-wait-time 2 './**/*.md' './**/*.html' './**/*.rst'
          fail: true
